apiVersion: apps/v1
kind: Deployment
metadata:
  name: Cheese-Rat-Cheese
  labels:
    app: Cheese-Rat-Cheese
spec:
  replicas: 3
  selector:
    matchLabels:
      app: Cheese-Rat-Cheese
  template:
    metadata:
      labels:
        app: Cheese-Rat-Cheese
    spec:
      containers:
      - name: Cheese-Rat-Cheese
        image: ghcr.io/cool129/cheese-rat-cheese-cicd:sha-18c161eeebaaf88e043255594a58dabeef54e2a7
        # Image will be automatically updated by CI/CD pipeline
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "0.5"
            memory: "512Mi"
          requests:
            cpu: "0.2"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      imagePullSecrets:
      - name: github-container-registry